<div class="page-shell">
  <div class="auth-card glass-card">
    <div class="topbar">
      <div class="eyebrow">New Learner</div>
      <h1>Create your account</h1>
      <p>Register once to access secure AI workflows and the adaptive routing dashboard.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        Username
        <input type="text" formControlName="username" autocomplete="username" />
      </label>

      <label>
        Email address
        <input type="email" formControlName="email" autocomplete="email" />
      </label>

      <label>
        Password
        <input type="password" formControlName="password" autocomplete="new-password" />
      </label>

      <div class="actions">
        <button type="submit" [disabled]="loading">{{ loading ? 'Creating account...' : 'Create Account' }}</button>
      </div>

      <p class="hint">Already registered? <a routerLink="/login">Sign in</a></p>

      <div class="message success" *ngIf="successMessage">{{ successMessage }}</div>
      <div class="message error" *ngIf="errorMessage">{{ errorMessage }}</div>
    </form>
  </div>
</div>
